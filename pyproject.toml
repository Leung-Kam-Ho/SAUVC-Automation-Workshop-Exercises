[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-workshop"
version = "0.1.0"
description = "Educational Minecraft automation workshop exercises"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "py-trees>=2.3.0",
    "pynput>=1.8.2",
    "ultralytics>=8.3.225",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["automation_scripts*", "minecraft*", "vision*"]
namespaces = true
