      color: [0, 255, 255]
    Blue flare:
      color: [255, 140, 0]
    Blue pail:
      color: [255, 0, 0]
      max_count: 1
    Gate:
      color: [255, 255, 255]
      max_count: 1
    Orange flare:
      color: [0, 140, 255]
      max_count: 1
    Red flare:
      color: [0, 0, 255]
    Red pail:
      color: [0, 0, 139]
    Yellow flare:
      color: [0, 255, 255]
